# CI on native Linux amd64 (ubuntu-latest):
#   checks  shellcheck, backend typecheck and tests
#   images  every image built for linux/amd64 and linux/arm64 (arm64 under QEMU)
#   stack   scripts/setup.sh (LAN mode, non-interactive), scripts/smoke.sh, restart, backup + restore
#   publish on version tags (v1.2.3): multi-arch images to GHCR, tagged with the exact version
#           (ghcr.io/<owner>/openduet-<service>:1.2.3; no floating tags). Servers use them with
#           DUET_IMAGE_PREFIX=ghcr.io/<owner>/openduet DUET_VERSION=1.2.3 ./scripts/setup.sh --pull
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install
        working-directory: backend
        run: bun install --frozen-lockfile && bunx prisma generate
      - name: Typecheck
        working-directory: backend
        run: bun run typecheck
      - name: Tests
        working-directory: backend
        run: bun test --timeout 30000

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        service: [backend, computer, egress, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build context
        id: ctx
        run: |
          echo "context=./${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "file=./${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.service }}" = computer ]; then
            # M20b: computer/Dockerfile patches the pinned OpenBot commit, given as the named
            # context `upstream` and read from compose.yml (single source of the commit).
            echo "upstream=upstream=$(awk '/^  computer:/ { c = 1 } c && /upstream:/ { print $2; exit }' compose.yml)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ steps.ctx.outputs.file }}
          build-contexts: ${{ steps.ctx.outputs.upstream }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  stack:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install and start with setup.sh (LAN mode, non-interactive)
        # A placeholder gateway: the stack starts and smoke.sh needs no model call.
        env:
          LLM_PROTOCOL: openai
          LLM_BASE_URL: https://models.invalid/v1
          LLM_API_KEY: ci-placeholder
          LLM_MODEL: ci-placeholder
        run: >-
          ./scripts/setup.sh --mode lan --yes --no-user --skip-models-check
          --public-url http://127.0.0.1:3000 --bind-addr 127.0.0.1 --wait-timeout 900
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Comes back after a restart
        run: |
          docker compose restart
          docker compose up -d --no-build --wait --wait-timeout 300
          docker compose exec -T backend bun src/cli/health.ts
      - name: Backup and restore
        run: |
          ./scripts/backup.sh backups/ci
          ./scripts/restore.sh backups/ci --yes
          docker compose exec -T backend bun src/cli/health.ts
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, images, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, computer, egress, caddy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and build context
        id: meta
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version=${GITHUB_REF_NAME#v}
          echo "image=ghcr.io/$owner/openduet-${{ matrix.service }}:$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "context=./${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "file=./${{ matrix.service }}/Dockerfile" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.service }}" = computer ]; then
            echo "upstream=upstream=$(awk '/^  computer:/ { c = 1 } c && /upstream:/ { print $2; exit }' compose.yml)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.file }}
          build-contexts: ${{ steps.meta.outputs.upstream }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
